services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /data/media
    volumes: [media:/data/media]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports: ["8000:8000"]

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /data/media
    volumes: [media:/data/media]
    depends_on: [backend]
    command: celery -A config worker -l info

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:80"]

  # ai_service (OCR / NLP / RAG / Qwen) is added in Phase 6–8. It needs a GPU host
  # and is deployed separately in production.

volumes:
  pgdata:
  media:
