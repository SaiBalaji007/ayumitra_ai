# Development stack. The database is SQLite: one file on the `appdata` volume, shared by the API
# and the Celery worker (same host, so WAL-mode locking works). No database server container.
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    env_file: .env
    environment:
      SQLITE_PATH: /data/db/db.sqlite3
      MEDIA_ROOT: /data/media
      REDIS_URL: redis://redis:6379/0
    volumes: [appdata:/data]
    depends_on: [redis]
    command: sh -c "mkdir -p /data/db /data/media && python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports: ["8000:8000"]

  worker:
    build: ./backend
    env_file: .env
    environment:
      SQLITE_PATH: /data/db/db.sqlite3
      MEDIA_ROOT: /data/media
      REDIS_URL: redis://redis:6379/0
    volumes: [appdata:/data]
    depends_on: [backend]
    command: celery -A config worker -l info -Q celery,documents --concurrency 2

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:80"]

  # ai_service (OCR / NLP / RAG / Qwen) is added in later phases. It needs a GPU host
  # and is deployed separately in production.

volumes:
  appdata:  # db.sqlite3 + private medical documents. Back this volume up.
